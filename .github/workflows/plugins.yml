name: Plugins

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'plugins/**'
      - '.github/workflows/plugins.yml'
      - '.github/pipepipe-pins.env'
  push:
    branches:
      - main
    tags:
      - 'plugins-v*'
    paths:
      - 'plugins/**'
      - '.github/workflows/plugins.yml'
      - '.github/pipepipe-pins.env'

env:
  REPO_NAME: PlasmolysisMango PipePipe Plugins
  # SHA-256 of the client release certificate (KEY_ALIAS pipepipe-plugins).
  RELEASE_CERT_SHA256: 30:1A:02:9B:40:19:35:D3:C7:6B:03:AC:6E:F7:A0:F5:CB:4F:9D:DF:96:81:B7:B6:47:44:F4:7B:96:EE:B7:AB

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build against the local extractor
        run: echo "extractorDir=../PipePipeExtractor" > plugins/local.properties

      - name: Run plugin unit tests
        id: test
        working-directory: plugins
        continue-on-error: true
        run: ./gradlew test --continue

      - name: Show test failures
        if: steps.test.outcome == 'failure'
        run: |
          for xml in plugins/*/build/test-results/test/*.xml; do
            [ -f "$xml" ] || continue
            awk '/<failure /{p=1} p{print FILENAME": "$0} /<\/failure>/{p=0}' "$xml"
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-test-reports
          path: plugins/*/build/reports/tests/test
          if-no-files-found: ignore

      - name: Fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install build tools
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Configure local build
        run: |
          printf 'sdk.dir=%s\nextractorDir=../PipePipeExtractor\n' "$ANDROID_HOME" > plugins/local.properties

      - name: Build plugin packages
        working-directory: plugins
        run: ./gradlew assembleRepo --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-packages
          path: plugins/build/repo/*.ppp
          if-no-files-found: error

  # The upstream 5.5.0 release has no plugin system; this APK is built from the client
  # submodule, which carries the plugin API patches.
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'gradle'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/client.keystore"

      - name: Build plugin-enabled APK
        working-directory: PipePipeClient
        env:
          KEY_PATH: ${{ runner.temp }}/client.keystore
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -DskipFormatKtlint --stacktrace

      - name: Verify APK is signed with the release key
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          for apk in PipePipeClient/app/build/outputs/apk/release/*.apk; do
            echo "== $(basename "$apk")"
            certs=$("$apksigner" verify --print-certs "$apk" 2>/dev/null)
            echo "$certs" | grep "certificate DN"
            echo "$certs" | grep -i "SHA-256" | sed 's/^ *//'
          done

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-enabled-apk
          path: PipePipeClient/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/plugins-v')
    runs-on: ubuntu-latest
    needs: [test, package, client]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install build tools
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Configure local build
        run: |
          printf 'sdk.dir=%s\nextractorDir=../PipePipeExtractor\n' "$ANDROID_HOME" > plugins/local.properties

      - uses: actions/download-artifact@v4
        with:
          name: plugin-enabled-apk
          path: apk

      - name: Write signing key
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
        run: |
          if [ -z "$PLUGIN_SIGNING_KEY" ]; then
            echo "PLUGIN_SIGNING_KEY secret is not set" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$PLUGIN_SIGNING_KEY" > "$RUNNER_TEMP/plugin-signing.key"

      - name: Build signed repository
        working-directory: plugins
        run: >-
          ./gradlew assembleRepo :tools:index
          -PpluginSigningKey="$RUNNER_TEMP/plugin-signing.key"
          -PrepoName="$REPO_NAME"
          --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          index_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/index.json"
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<EOF
          PipePipe plugins built from ${GITHUB_SHA}.

          Add this URL in PipePipe → Settings → Plugins → Add repository:

          ${index_url}

          The PipePipe_*.apk assets are the client in this repository, the only builds with
          plugin support (upstream 5.5.0 has none). They are signed with this repository's own
          release key, not the upstream one, so uninstall the official PipePipe first.
          Certificate SHA-256: ${RELEASE_CERT_SHA256}
          Adult content: enable plugin support and "show NSFW" in the app settings.
          EOF
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" plugins/build/repo/index.json plugins/build/repo/*.ppp \
              apk/*.apk --clobber
          else
            gh release create "$tag" plugins/build/repo/index.json plugins/build/repo/*.ppp \
              apk/*.apk --title "$tag" --notes-file "$notes"
          fi
