name: Plugins

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'plugins/**'
      - '.github/workflows/plugins.yml'
      - '.github/pipepipe-pins.env'
  push:
    branches:
      - main
    tags:
      - 'plugins-v*'
    paths:
      - 'plugins/**'
      - '.github/workflows/plugins.yml'
      - '.github/pipepipe-pins.env'

env:
  REPO_NAME: PlasmolysisMango PipePipe Plugins

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build against the local extractor
        run: echo "extractorDir=../PipePipeExtractor" > plugins/local.properties

      - name: Run plugin unit tests
        id: test
        working-directory: plugins
        continue-on-error: true
        run: ./gradlew test --continue --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-test-reports
          path: plugins/*/build/reports/tests/test
          if-no-files-found: ignore

      - name: Fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install build tools
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Configure local build
        run: |
          printf 'sdk.dir=%s\nextractorDir=../PipePipeExtractor\n' "$ANDROID_HOME" > plugins/local.properties

      - name: Build plugin packages
        working-directory: plugins
        run: ./gradlew assembleRepo --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-packages
          path: plugins/build/repo/*.ppp
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/plugins-v')
    runs-on: ubuntu-latest
    needs: [test, package]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install build tools
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Configure local build
        run: |
          printf 'sdk.dir=%s\nextractorDir=../PipePipeExtractor\n' "$ANDROID_HOME" > plugins/local.properties

      - name: Write signing key
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
        run: |
          if [ -z "$PLUGIN_SIGNING_KEY" ]; then
            echo "PLUGIN_SIGNING_KEY secret is not set" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$PLUGIN_SIGNING_KEY" > "$RUNNER_TEMP/plugin-signing.key"

      - name: Build signed repository
        working-directory: plugins
        run: >-
          ./gradlew assembleRepo :tools:index
          -PpluginSigningKey="$RUNNER_TEMP/plugin-signing.key"
          -PrepoName="$REPO_NAME"
          --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          index_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/index.json"
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<EOF
          PipePipe plugins built from ${GITHUB_SHA}.

          Add this URL in PipePipe → Settings → Plugins → Add repository:

          ${index_url}

          Packages require a host with plugin API 1.1 (the custom APK built by this repository's CI).
          Adult content: enable plugin support and "show NSFW" in the app settings.
          EOF
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" plugins/build/repo/index.json plugins/build/repo/*.ppp --clobber
          else
            gh release create "$tag" plugins/build/repo/index.json plugins/build/repo/*.ppp \
              --title "$tag" --notes-file "$notes"
          fi
