plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'pipepipe-plugins'

include 'common', 'test-support', 'missav', 'aacg', 'tools'

// Optional: build against a local PipePipeExtractor checkout instead of the published one.
// Put `extractorDir=../PipePipeExtractor` into local.properties (CI does this).
def localProps = new Properties()
def localPropsFile = file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def extractorDir = localProps.getProperty('extractorDir')
if (extractorDir != null) {
    includeBuild(extractorDir)
}
